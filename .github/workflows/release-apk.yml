name: Build and Release ARM64 APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-apk-${{ github.ref }}
  cancel-in-progress: false

env:
  KEYSTORE_PATH: release-signing-key.jks
  RELEASE_TAG: build-${{ github.run_number }}

jobs:
  build-and-release:
    name: Build signed release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platforms;android-37" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          for secret_name in \
            KEYSTORE_BASE64 \
            RELEASE_STORE_PASSWORD \
            RELEASE_KEY_ALIAS \
            RELEASE_KEY_PASSWORD
          do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Required repository secret $secret_name is not set."
              exit 1
            fi
          done

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          test -s "$KEYSTORE_PATH"

      - name: Build release APK only
        shell: bash
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare release APK
        shell: bash
        run: |
          apk_path="app/build/outputs/apk/release/app-release.apk"
          test -f "$apk_path"
          build_tools_dir="${ANDROID_SDK_ROOT}/build-tools"
          apksigner="$(find "$build_tools_dir" -path '*/apksigner' -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk_path"
          if unzip -l "$apk_path" | grep -Eq 'assets/dxls/dxls-(armeabi-v7a|x86|x86_64)|lib/(armeabi-v7a|x86|x86_64)/'; then
            echo "::error::The APK contains a non-arm64-v8a payload."
            exit 1
          fi
          unzip -l "$apk_path" | grep -q 'assets/dxls/dxls-arm64-v8a'
          mkdir -p release
          cp "$apk_path" "release/Dioxamine-${RELEASE_TAG}-arm64-v8a-release.apk"

      - name: Create GitHub Release and attach APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Dioxamine ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: release/Dioxamine-${{ env.RELEASE_TAG }}-arm64-v8a-release.apk